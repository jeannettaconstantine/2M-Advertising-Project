<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Soft shadow filter for reflection -->
    <linearGradient id="reflectionGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Group: Emblem Inside Oval -->
  <g id="logo-mark">
    <!-- Outer Oval Ring -->
    <ellipse cx="300" cy="180" rx="260" ry="145" fill="none" stroke="#223886" stroke-width="15"/>

    <!-- Perspective Floor Shadow / Reflection -->
    <g transform="translate(300, 290) scale(1, 0.35) rotate(15) translate(-300, -290)" opacity="0.65">
      <!-- Shadow M base -->
      <path d="M 210 270 L 250 270 L 275 310 L 300 270 L 325 310 L 350 270 L 390 270 L 390 320 L 340 320 L 300 370 L 260 320 L 210 320 Z" fill="url(#reflectionGrad)" />
      <!-- Shadow dots & heads -->
      <ellipse cx="230" cy="340" rx="16" ry="10" fill="#94A3B8" opacity="0.5"/>
      <ellipse cx="370" cy="340" rx="16" ry="10" fill="#94A3B8" opacity="0.5"/>
      <circle cx="280" cy="350" r="5" fill="#94A3B8" opacity="0.5"/>
      <circle cx="300" cy="352" r="5" fill="#94A3B8" opacity="0.5"/>
      <circle cx="320" cy="350" r="5" fill="#94A3B8" opacity="0.5"/>
    </g>

    <!-- Center 'M' Body (Royal Blue) -->
    <!-- Two pillars with curved bottom, central dip -->
    <g id="central-m">
      <!-- Back of the orbit ring (behind the pillars) -->
      <path d="M 160 190 C 180 160, 420 160, 440 190" fill="none" stroke="#223886" stroke-width="12" stroke-linecap="round"/>

      <!-- M Character -->
      <path d="
        M 200 135 
        L 265 135 
        C 275 170, 285 185, 300 185 
        C 315 185, 325 170, 335 135 
        L 400 135 
        L 400 250 
        C 400 268, 385 278, 365 278 
        C 345 278, 330 268, 330 250 
        L 330 215 
        C 320 228, 310 235, 300 235 
        C 290 235, 280 228, 270 215 
        L 270 250 
        C 270 268, 255 278, 235 278 
        C 215 278, 200 268, 200 250 
        Z
      " fill="#223886"/>

      <!-- Front of the orbit ring (in front of the M) -->
      <path d="M 140 190 C 170 235, 430 235, 460 190 C 440 215, 160 215, 140 190 Z" fill="#223886"/>

      <!-- Two Red Circular Heads -->
      <circle cx="233" cy="100" r="28" fill="#D81E28"/>
      <circle cx="367" cy="100" r="28" fill="#D81E28"/>

      <!-- 3 Blue Arched Dots between the heads -->
      <circle cx="275" cy="85" r="9" fill="#223886"/>
      <circle cx="300" cy="78" r="9" fill="#223886"/>
      <circle cx="325" cy="85" r="9" fill="#223886"/>
    </g>
  </g>

  <!-- Typography Below: cv. 2 M Advertisin G -->
  <g id="logo-text" transform="translate(300, 440)" text-anchor="middle" font-family="'Times New Roman', Georgia, serif">
    <text x="0" y="0" font-size="56" font-weight="bold" letter-spacing="1">
      <!-- cv. 2 in Blue -->
      <tspan fill="#223886">cv.</tspan>
      <tspan fill="#223886" dx="4">2</tspan>
      <!-- M in Red -->
      <tspan fill="#D81E28" font-size="64" dx="6">M</tspan>
      <!-- Advertisin in Blue -->
      <tspan fill="#223886" dx="6">Advertisin</tspan>
      <!-- G in Red -->
      <tspan fill="#D81E28" font-size="64" dx="2">G</tspan>
    </text>

    <!-- Underline bar under "Advertisin" -->
    <!-- Coordinates calibrated under the text -->
    <rect x="-10" y="10" width="225" height="5" fill="#223886" />
  </g>
</svg>
